version: '3.8'

services:
  db:
    image: postgres:16
    # Always pin specific versions in production, not just 'latest'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: rbac_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  # This ensures your database isn't wiped out every time you stop Docker
  postgres_data: